name: Release

# Triggered by pushing a v* tag (scripts/release.sh does it) or manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0). Must match the version in package.json'
        required: true
        type: string
      draft:
        description: 'Leave the release as a draft instead of publishing it'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-26.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The changelog entry lives in the tagged commit; full history is not
          # needed, but keep it so `git describe`/tags are available.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Resolve and validate the tag
        id: version
        shell: bash
        run: |
          # The three files carry the same version or the release stops here.
          node scripts/check-versions.mjs
          tag="${{ inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "The tag ($tag) does not match package.json ($pkg)." >&2
            echo "Update the versions with: pnpm release ${tag#v}" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the release body from the changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          body="$(node scripts/changelog.mjs extract "$version" || true)"
          if [ -z "$body" ]; then
            body="Installers built automatically."
          fi
          {
            printf '%s\n\n' "$body"
            printf -- '---\n\n'
            printf '**Installers**\n\n'
            printf -- '- **Linux**: `.deb`, `.rpm` and AppImage (x64 and arm64)\n'
            printf -- '- **macOS**: universal `.dmg` (Intel + Apple Silicon)\n'
            printf -- '- **Windows**: `.msi` and `.exe` (NSIS)\n\n'
            printf 'This build is unsigned: macOS and Windows will ask you to confirm the first launch.\n\n'
            printf '**Verify a download**\n\n'
            printf 'Every release ships `SHA256SUMS` and a CycloneDX SBOM (`sbom.cyclonedx.json`):\n\n'
            printf '```bash\nsha256sum --check SHA256SUMS\n```\n\n'
            printf 'Full documentation: https://jigonzalez930209.github.io/md-view/\n'
          } > release-body.md
          echo '--- release body ---'
          cat release-body.md

      - name: Create the draft release
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.TAG;
            const body = fs.readFileSync('release-body.md', 'utf8');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `md-view ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  publish:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on 22.04 (glibc 2.35) so the packages run on 22.04 LTS and newer.
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
          - platform: ubuntu-22.04-arm
            args: '--bundles deb,rpm,appimage'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: windows-latest
            args: '--bundles msi,nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No appindicator: the app has no system tray and that package does not
      # exist on Ubuntu 26.04. The RPM bundler is pure Rust, so `rpm`/`rpmbuild`
      # are not needed either.
      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # On macOS we build a universal binary (Intel + Apple Silicon).
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload the installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Tauri appends its own defaults to the .deb dependencies and one of them
      # (`libgtk-3-0`) does not exist on Ubuntu 24.04+, which would make the
      # package refuse to install there. Rewrite the field and replace the asset
      # uploaded by the previous step.
      - name: Fix the .deb dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          deb="$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)"
          bash scripts/fix-deb-depends.sh "$deb"
          gh release upload "$TAG" "$deb" --clobber

  # Runs only when every platform built: a failed build leaves the draft for review.
  finalize:
    name: Publish release
    needs: [create-release, publish]
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - name: Check the installers
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          for pattern in '\.deb$' '\.rpm$' '\.AppImage$' '\.dmg$' '\.msi$' '-setup\.exe$'; do
            if ! grep -qE -- "$pattern" <<< "$assets"; then
              echo "::error::Missing installer matching $pattern; the release stays a draft"
              exit 1
            fi
          done
          # Both architectures must be there: x64 and arm64.
          for pattern in '_amd64\.deb$' '_arm64\.deb$'; do
            if ! grep -qE -- "$pattern" <<< "$assets"; then
              echo "::error::Missing package matching $pattern; the release stays a draft"
              exit 1
            fi
          done

      - name: Checksums
        run: |
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --clobber
          (cd assets && sha256sum -- * > SHA256SUMS && sha256sum --check SHA256SUMS)
          gh release upload "$TAG" assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          cat assets/SHA256SUMS

      - name: Software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach the SBOM
        run: gh release upload "$TAG" sbom.cyclonedx.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # Events caused by GITHUB_TOKEN (like this `release: published`) do not
      # start other workflows; workflow_dispatch is the exception.
      - name: Refresh the APT repository and the docs
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
