name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        md-view stays deliberately small: no plugins, no cloud, no Markdown beyond GitHub.
        See the [roadmap](https://github.com/jigonzalez930209/md-view/blob/main/ROADMAP.md)
        before proposing something big.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
