name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A small document that triggers the problem is the most useful
        thing you can attach.
  - type: input
    id: version
    attributes:
      label: Version
      description: From the About window or the installer name (for example 0.7.0)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (.deb)
        - Linux (.rpm)
        - Linux (AppImage)
        - Linux (APT repository)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (.msi)
        - Windows (.exe)
        - Browser mode (pnpm dev)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Desktop Environment / Display Scaling
      description: e.g. GNOME Wayland, KDE X11, macOS Retina, Windows 11 at 125% DPI
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Affected Area
      description: What part of the app is failing?
      options:
        - Native Dialogs (Open / Save / Save As)
        - File Association / Drag & Drop
        - External Changes & File Conflicts
        - Encodings (UTF-16, Latin1, BOM)
        - Preview / Markdown / Mermaid / KaTeX
        - Find in Preview / Headings Outline
        - Session Restore / Unsaved Drafts
        - Export (PDF, HTML, SVG, Image) or Print
        - Performance / Large Files
        - Accessibility / Screen Reader / Keyboard navigation
        - Other
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      placeholder: Exact steps, and the Markdown snippet/document that triggers it if there is one
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Include the exact error message, screenshot or console output if there is one
    validations:
      required: true
