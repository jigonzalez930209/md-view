name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/apt-repo.sh'
  # Publishing a release refreshes the APT repository with its .deb.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      # Always from the default branch: a release event would otherwise check
      # out the tag's tree and build the APT repository with older scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Falla si hay enlaces internos rotos.
      - run: pnpm docs:build

      # The APT repository lives next to the documentation, at /md-view/apt,
      # and is rebuilt from the .deb of the latest published release.
      - name: Build the APT repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          mkdir -p /tmp/deb
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir /tmp/deb --clobber || true
          if ! ls /tmp/deb/*.deb >/dev/null 2>&1; then
            echo "::warning::No .deb found in the latest release; skipping the APT repository"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg
          bash scripts/apt-repo.sh docs/.vitepress/dist/apt /tmp/deb/*.deb

      # Pages must be enabled once for the repository with
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # (`enablement: true` is not an option here: the action requires a token
      # other than GITHUB_TOKEN, for example a PAT with the `repo` scope.)
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
