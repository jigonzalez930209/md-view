<svg xmlns="http://www.w3.org/2000/svg" width="420" height="110" viewBox="0 0 420 110" role="img" aria-label="SVG animado de ejemplo">
  <defs>
    <linearGradient id="mdview-gradiente" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4493f8"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="418" height="108" rx="12" fill="none" stroke="#8888a0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="8" y="8" width="404" height="94" rx="9" fill="none" stroke="#8888a0" stroke-width="0.5" opacity="0.35"/>

  <!-- Animacion SMIL: no necesita JavaScript, funciona dentro de <img>. -->
  <circle cx="58" cy="55" r="16" fill="url(#mdview-gradiente)">
    <animate attributeName="r" values="12;20;12" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#8888a0" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M100 55h150">
      <animate attributeName="stroke-dasharray" values="0 260;260 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="100" y="40" font-family="monospace" font-size="14" fill="#8b949e">SVG animado (SMIL)</text>
  <text x="100" y="80" font-family="monospace" font-size="12" fill="#6e7681">sin JavaScript, dentro de una etiqueta img</text>
</svg>
