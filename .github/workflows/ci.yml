name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    name: Backend (fmt + tests)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Sin appindicator: la app no usa bandeja del sistema (no compilamos la
      # feature `tray-icon` de Tauri) y ese paquete no existe en 26.04.
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formato
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
