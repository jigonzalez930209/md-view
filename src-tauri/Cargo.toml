[package]
name = "md-view"
version = "0.7.0"
description = "Minimalist Markdown viewer and editor"
license = "MIT"
homepage = "https://jigonzalez930209.github.io/md-view/"
repository = "https://github.com/jigonzalez930209/md-view"
authors = ["jigonzalez930209"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The binary lives in main.rs and delegates to this library (standard Tauri 2 layout).
name = "md_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux webview fine-tuning (smooth scrolling and printing to PDF).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
