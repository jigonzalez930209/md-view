# esbuild (a dependency of VitePress' Vite) needs its install script to
# validate the platform binary; pnpm blocks install scripts by default.
allowBuilds:
  esbuild: true
  # Downloads the ffmpeg binary used by the promo video pipeline (scripts/promo).
  ffmpeg-static: true

# Security: force the patched lodash-es used by mermaid's chevrotain.
overrides:
  lodash-es: '>=4.18.1'
  # KaTeX 0.18 renamed its internal CSS classes (base -> katex-base): the
  # renderer must match the stylesheet, and the markdown-it plugin still
  # declares ^0.16, so force every copy to the same 0.18 line.
  katex: '^0.18.9'
