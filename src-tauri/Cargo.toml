[package]
name = "md-view"
version = "0.1.0"
description = "Visor y editor de Markdown minimalista"
authors = ["md-view"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# El binario vive en main.rs y delega en esta libreria (estructura estandar de Tauri 2).
name = "md_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ajustes finos del webview en Linux (scroll suave e impresion a PDF).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
