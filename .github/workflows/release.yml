name: Release

# Triggered by pushing a v* tag (scripts/release.sh does it) or manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.2.0). Must match the version in package.json'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release (draft)
    runs-on: ubuntu-26.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog entry lives in the tagged commit; full history is not
          # needed, but keep it so `git describe`/tags are available.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve and validate the tag
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "The tag ($tag) does not match package.json ($pkg)." >&2
            echo "Update the versions with: pnpm release ${tag#v}" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the release body from the changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          body="$(node scripts/changelog.mjs extract "$version" || true)"
          if [ -z "$body" ]; then
            body="Installers built automatically."
          fi
          {
            printf '%s\n\n' "$body"
            printf -- '---\n\n'
            printf '**Installers**\n\n'
            printf -- '- **Linux**: `.deb`, `.rpm` and AppImage\n'
            printf -- '- **macOS**: universal `.dmg` (Intel + Apple Silicon)\n'
            printf -- '- **Windows**: `.msi` and `.exe` (NSIS)\n\n'
            printf 'This build is unsigned: macOS and Windows will ask you to confirm the first launch.\n\n'
            printf 'Full documentation: https://jigonzalez930209.github.io/md-view/\n'
          } > release-body.md
          echo '--- release body ---'
          cat release-body.md

      - name: Create the draft release
        id: create-release
        uses: actions/github-script@v9
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.TAG;
            const body = fs.readFileSync('release-body.md', 'utf8');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `md-view ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  publish:
    name: Build (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-26.04
            args: '--bundles deb,rpm,appimage'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: windows-latest
            args: '--bundles msi,nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # No appindicator: the app has no system tray and that package does not
      # exist on Ubuntu 26.04. The RPM bundler is pure Rust, so `rpm`/`rpmbuild`
      # are not needed either.
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # On macOS we build a universal binary (Intel + Apple Silicon).
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload the installers
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Tauri appends its own defaults to the .deb dependencies and one of them
      # (`libgtk-3-0`) does not exist on Ubuntu 24.04+, which would make the
      # package refuse to install there. Rewrite the field and replace the asset
      # uploaded by the previous step.
      - name: Fix the .deb dependencies
        if: matrix.platform == 'ubuntu-26.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          deb="$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)"
          bash scripts/fix-deb-depends.sh "$deb"
          gh release upload "$TAG" "$deb" --clobber
